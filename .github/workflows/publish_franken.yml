name: Publish franken-master image

# Builds the scan image from the checked-out source and publishes it to GHCR, tagged
# with the commit SHA. Downstream (cartography-assistant) pulls that tag and retags it
# into ECR instead of building cartography itself, so there is exactly one build of
# cartography in the system.
#
# Triggers on the Dockerfile changing rather than on every commit: a push to the
# branch is cheap and frequent, and rebuilding a 1.5 GB image for a docs commit wastes
# minutes and storage. Run it by hand for a normal commit.

on:
  workflow_dispatch:
  push:
    branches: [franken-master]
    paths:
      - Dockerfile.franken
      - .github/workflows/publish_franken.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-franken
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm derives the package version from git tags, so the build
          # needs history and tags. A shallow clone yields version 0.0.0.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile.franken
          # Cluster nodes are arm64. Publish only that platform: a multi-arch manifest
          # would double the build time for an image nothing consumes on amd64.
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cartography-franken:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cartography-franken:latest

      - name: Summary
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### published \`${SHA:0:8}\`"
            echo ""
            echo "ghcr.io/${{ github.repository_owner }}/cartography-franken:${SHA:0:8}"
            echo ""
            echo "Next, in cartography-assistant: set \`CARTOGRAPHY_REF=${SHA:0:8}\`"
            echo "and run \`build:cartography-ecr\` on \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
